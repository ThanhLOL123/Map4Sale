name: Deploy Edge Functions

# Deploys the Supabase Edge Functions (create-user, manage-user, log-login)
# without a local machine or CLI. Requires ONE GitHub secret:
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#     https://supabase.com/dashboard/account/tokens
# The project ref below is not secret (it's in your project URL).

on:
  workflow_dispatch: {} # run manually from the Actions tab
  push:
    branches: [main]
    paths: ['supabase/functions/**'] # auto-redeploy when a function changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wtyrnkbgwzwziwqbqkua
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          for fn in create-user manage-user log-login; do
            echo "Deploying $fn…"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
          echo "All Edge Functions deployed."
